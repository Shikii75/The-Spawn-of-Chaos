<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drift Up</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Drift Up</h1>
      <p>Tap or click to flip the drift. Survive as long as possible.</p>
      <canvas id="game" width="480" height="720"></canvas>
      <div class="hud">
        <div class="score">Score: <span id="score">0</span>s</div>
        <button id="restart">Restart</button>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
