<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Spawn of Chaos — Main Menu Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020105;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Georgia, 'Times New Roman', serif;
            overflow: hidden;
        }
        h1 {
            color: rgba(140, 135, 175, 0.5);
            font-size: 14px;
            font-weight: normal;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        canvas {
            border: 1px solid rgba(120, 60, 200, 0.2);
            box-shadow: 0 0 80px rgba(80, 30, 160, 0.15);
            max-width: 95vw;
            max-height: 80vh;
        }
        .hint {
            color: rgba(100, 95, 130, 0.4);
            font-size: 12px;
            margin-top: 16px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Menu Preview — JavaScript + C# Shared Design</h1>
    <canvas id="menuCanvas" width="1920" height="1080"></canvas>
    <p class="hint">Same visual language as the Unity in-game menu. Click anywhere for chaos bursts.</p>

    <script src="Assets/Scenes/scripts/Main Menu/main-menu-effects.js"></script>
    <script>
        var menu = SpawnOfChaosMenu.initCanvasMenu('menuCanvas');
        var canvas = document.getElementById('menuCanvas');

        canvas.addEventListener('click', function (e) {
            var rect = canvas.getBoundingClientRect();
            var scaleX = canvas.width / rect.width;
            var scaleY = canvas.height / rect.height;
            var x = (e.clientX - rect.left) * scaleX;
            var y = (e.clientY - rect.top) * scaleY;

            for (var i = 0; i < 12; i++) {
                var angle = Math.random() * Math.PI * 2;
                var speed = 100 + Math.random() * 250;
                var r = 4 + Math.random() * 12;
                // Burst drawn inline for preview interactivity
            }
        });
    </script>
</body>
</html>
